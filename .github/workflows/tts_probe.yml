name: tts-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: render
        run: |
          set -e
          mkdir -p out
          read -r -d '' TEXT <<'TXT' || true
          என்னோட SIP returns அஞ்சு வருஷம் கழிச்சு பார்த்தேன். என் friend ஓட boring fund என்னை விட lakhs ல அதிகமா கொடுத்துருக்கு. Same market ல இருந்தும்!
          TXT
          render() {
            local vid="$1" name="$2"
            jq -n --arg t "$TEXT" '{text:$t, model_id:"eleven_v3", voice_settings:{stability:0.5, similarity_boost:0.75}}' > req.json
            code=$(curl -s -o "out/${name}.mp3" -w '%{http_code}' -X POST "https://api.elevenlabs.io/v1/text-to-speech/${vid}?output_format=mp3_44100_128" -H "xi-api-key: ${ELEVENLABS_API_KEY}" -H 'Content-Type: application/json' -d @req.json)
            echo "${name}: HTTP ${code} bytes $(stat -c%s out/${name}.mp3 2>/dev/null || echo 0)"
          }
          render 21m00Tcm4TlvDq8ikWAM el_fem_rachel
          render EXAVITQu4vr4xnSDxMaL el_fem_bella
          render pNInz6obpgDQGcFmaJgB el_male_adam
          render ErXwobaYiN019PkySvjV el_male_antoni
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-tamil-probe
          path: out/*.mp3
