name: Quota Check (diagnostic)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: One minimal request per provider
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== GROQ gpt-oss-120b ==="
          curl -s -o /tmp/groq.json -w "HTTP %{http_code}\n" \
            -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"hi"}],"max_tokens":1}' \
            -D /tmp/groq.h
          head -c 400 /tmp/groq.json; echo
          grep -i "x-ratelimit" /tmp/groq.h | head -8
          echo "=== GEMINI 3.7-flash ==="
          curl -s -o /tmp/gem.json -w "HTTP %{http_code}\n" \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"hi"}]}],"generationConfig":{"maxOutputTokens":1}}'
          head -c 400 /tmp/gem.json; echo
